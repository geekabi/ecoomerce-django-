<table class="w-full bg-white rounded shadow">

<thead class="border-b bg-gray-50">
<tr>
    <th class="p-3 text-right">نام</th>
    <th>قیمت</th>
</tr>
</thead>

<tbody>

{% for product in products %}

<tr class="border-b hover:bg-gray-50">
    <td class="p-3">
        {{ product.name }}
    </td>

    <td>
        {{ product.price }}
    </td>
</tr>

{% empty %}

<tr>
    <td colspan="2" class="p-4 text-center">
        محصولی وجود ندارد
    </td>
</tr>

{% endfor %}

</tbody>

</table>
