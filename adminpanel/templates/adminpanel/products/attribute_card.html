<div class="card">

    <h3>{{ attr.name }}</h3>

    <div id="values-{{ attr.id }}">
        {% for val in attr.values.all %}
            <label>
                <input type="checkbox" name="values" value="{{ val.id }}">
                {{ val.value }}
            </label>
        {% endfor %}
    </div>

    <!-- ❌ فرم حذف شد -->
    <!-- ✅ جایگزین: div با hx-post -->

    <div
        hx-post="{% url 'adminpanel:admin-attribute-value-create' attr.id %}"
        hx-target="#values-{{ attr.id }}"
        hx-swap="beforeend"
    >
        {% csrf_token %}
        <input type="text" name="value" placeholder="مقدار جدید">
        <button type="submit">+</button>
    </div>

</div>
